name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  quality:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify tag matches package version
        run: |
          PACKAGE_VERSION=$(bun -p 'require("./package.json").version')
          test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"
      - name: Check project
        run: bun run check

  package:
    name: Package ${{ matrix.platform }}
    needs: quality
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS executables are built on macOS so that codesign can sign them after Bun appends the app.
          - platform: darwin-arm64
            target: bun-darwin-arm64
            runner: macos-latest
          - platform: darwin-x64
            target: bun-darwin-x64
            runner: macos-latest
          - platform: linux-arm64
            target: bun-linux-arm64
            runner: ubuntu-latest
          - platform: linux-x64
            target: bun-linux-x64-baseline
            runner: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build web application
        run: bun run build:web
      - name: Cross-compile executable
        run: bun build --compile --minify --target=${{ matrix.target }} src/cli.ts --outfile dist/reviewonator-${{ matrix.platform }}
      - name: Sign macOS executable
        if: startsWith(matrix.platform, 'darwin-')
        run: |
          # Bun's linker signature no longer matches once the app is appended; macOS may kill such an executable.
          codesign --force --sign - "dist/reviewonator-${{ matrix.platform }}"
          codesign --verify --strict --verbose=2 "dist/reviewonator-${{ matrix.platform }}"
      - name: Run executable on its own platform
        if: matrix.platform == 'darwin-arm64' || matrix.platform == 'linux-x64'
        run: dist/reviewonator-${{ matrix.platform }} --version
      - name: Package release archive
        run: ./scripts/package-release.sh "${{ matrix.platform }}" "dist/reviewonator-${{ matrix.platform }}" release
      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: reviewonator-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* scripts/install.sh --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

  homebrew:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Require the tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN secret is required." >&2
            exit 1
          fi
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Download release checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.sha256' --dir checksums
      - name: Render formula
        run: bun scripts/render-formula.ts "${GITHUB_REF_NAME#v}" checksums > reviewonator.rb
      - name: Check out tap
        uses: actions/checkout@v7
        with:
          repository: johniak/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Publish formula
        run: |
          mkdir -p tap/Formula
          cp reviewonator.rb tap/Formula/reviewonator.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/reviewonator.rb
          if git diff --cached --quiet; then
            echo "The formula is already up to date."
            exit 0
          fi
          git commit -m "reviewonator ${GITHUB_REF_NAME}"
          git push

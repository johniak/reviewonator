<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Reviewonator</title>
    <!-- The server replaces {} with the preferences saved by earlier runs. -->
    <script id="reviewonator-preferences" type="application/json">{}</script>
    <script>
      // Apply the theme before the first paint. Kept in sync with web/theme.ts.
      (function () {
        var stored = null;
        try { stored = JSON.parse(document.getElementById("reviewonator-preferences").textContent).theme; } catch (error) {}
        var theme = stored === "light" || stored === "dark"
          ? stored
          : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
